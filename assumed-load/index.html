<head>

        gtag('js', new Date());

        gtag('config', 'G-8SPTF9XPGC');

  <script type="module" crossorigin src="/assets/assumed-load-lsGCwN_5.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">

</head>

<body>
    <a href="../" class="back-link">
        <span>←</span> 電工メモ
    </a>

    <header>
        <h1>一般住宅の負荷想定</h1>
    </header>

    <main class="calculator-card">
        <section class="calc-section">
            <div class="form-group">
                <div class="label-row">
                    <label for="main-area">床面積 (㎡)</label>
                    <details class="info-details">
                        <summary>?</summary>
                        <div class="info-content">
                            住宅全体の床面積を入力してください。<br>
                            1㎡あたり40VAとして計算。
                        </div>
                    </details>
                </div>
                <input type="number" id="main-area" value="100" min="0">
            </div>
        </section>

        <section class="calc-section">
            <div class="form-group">
                <div class="label-with-toggle">
                    <div class="label-row">
                        <label for="extra-load">住宅等の加算負荷 (VA)</label>
                        <details class="info-details">
                            <summary>?</summary>
                            <div class="info-content">
                                エアコン2台目以降や容量の大きな機器があれば加算してください。
                            </div>
                        </details>
                    </div>
                    <label class="toggle-container">
                        <input type="checkbox" id="enable-manual-extra">
                        <span class="toggle-text">手動入力</span>
                    </label>
                </div>
                <input type="number" id="extra-load" value="500" min="0" step="500" disabled>
            </div>
        </section>

        <div class="results-container">
            <div class="result-item">
                <div class="result-label">設備負荷容量</div>
                <div id="total-va" class="result-value">--<span class="result-unit">VA</span></div>
            </div>
            <div class="result-item">
                <div class="result-label">100V時の電流</div>
                <div id="total-current" class="result-value">--<span class="result-unit">A</span></div>
            </div>
            <div class="result-item highlight">
                <div class="result-label">推奨分岐回路数 (20A)</div>
                <div id="circuit-count" class="result-value">--<span class="result-unit">回路</span></div>
                <small class="hint text-center">※1500VA/回路として計算</small>
            </div>
        </div>

        <div class="table-info">
            <p>※ 一般住宅：40 VA/㎡ として計算します</p>
            <p>※ 住宅、アパートの1世帯につき加算負荷：500〜1000VA</p>
            <p>※ 内線規程における勧告値に基づいた想定負荷です。</p>
            <p>※ 実際の設計には、設置機器の定格容量を優先してください。</p>
        </div>
    </main>

</body>

</html>
